[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualize-okf"
version = "0.2.0"
description = "Self-contained HTML graph visualizer for Open Knowledge Format (OKF) v0.2 bundles"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "okf-core",
]
readme = "README.md"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
visualize-okf = "visualize_okf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visualize_okf = ["viewer/templates/*.html", "viewer/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../okf_core/src"]
