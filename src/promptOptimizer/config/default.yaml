# yaml-language-server: $schema=./schemas/default.schema.json
# promptOptimizer default configuration.
# Secrets are NEVER stored here — only env var *names* under backends.*.env_key.
# CLI flags override these values (see README).

models:
  # Defaults when CLI omits --backend / --reflection-backend
  task_backend: nrp
  reflection_backend: openrouter
  judge: reflection   # task | reflection

  backends:
    nrp:
      env_key: NRP_API_KEY
      api_base: https://ellm.nrp-nautilus.io/v1
      task_model: custom_openai/qwen3
      reflection_model: custom_openai/kimi
      temperature_task: 0.0
      temperature_reflection: 1.0
      max_tokens_task: 16000
      max_tokens_reflection: 12000
      timeout: 180
      num_retries: 1

    openrouter:
      env_key: OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      task_model: openrouter/tencent/hy3:free
      reflection_model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      temperature_task: 0.0
      temperature_reflection: 1.0
      max_tokens_task: 16000
      max_tokens_reflection: 12000
      timeout: 180
      num_retries: 2

    xai:
      env_key: XAI_API_KEY
      # api_base optional — litellm routes xai/<model>
      task_model: xai/grok-4.5
      reflection_model: xai/grok-4.5
      temperature_task: 0.0
      temperature_reflection: 1.0
      max_tokens_task: 16000
      max_tokens_reflection: 12000
      timeout: 180
      num_retries: 2

    nvidia:
      env_key: NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
      # OpenAI-compatible Integrate API; openai/ prefix for litellm
      task_model: openai/nvidia/nemotron-3-ultra-550b-a55b
      reflection_model: openai/nvidia/nemotron-3-ultra-550b-a55b
      temperature_task: 0.0
      temperature_reflection: 1.0
      max_tokens_task: 16000
      max_tokens_reflection: 12000
      timeout: 180
      num_retries: 2

run:
  seed: 0
  num_threads: 8
  auto: light          # light | medium | heavy
  gepa_budget: null    # or int, e.g. 80
  # Active goal is config/profile.yaml (or --profile), not a run.task enum.

data:
  train_frac: 0.5
  val_frac: 0.25
  min_val: 3
  min_test: 3

optimizers:
  bootstrap:
    metric_threshold: 0.7
    max_bootstrapped_demos: 4
    max_labeled_demos: 4
