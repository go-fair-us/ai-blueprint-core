<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-size="44" font-weight="bold" fill="#1f3a5f">How Web Bot Auth Works</text>
  <text x="800" y="115" text-anchor="middle" font-size="24" fill="#4a5a6a">An AI agent proves who sent it, like a letter sealed with a stamp anyone can check</text>

  <!-- ===== Public key directory (top center) ===== -->
  <rect x="580" y="175" width="440" height="150" rx="16" fill="#e6f4f5" stroke="#0e7c86" stroke-width="3"/>
  <!-- book/directory icon -->
  <g transform="translate(612,212)">
    <rect x="0" y="0" width="56" height="72" rx="6" fill="#0e7c86"/>
    <rect x="10" y="12" width="36" height="6" rx="2" fill="#ffffff"/>
    <rect x="10" y="26" width="36" height="6" rx="2" fill="#ffffff"/>
    <rect x="10" y="40" width="24" height="6" rx="2" fill="#ffffff"/>
    <circle cx="40" cy="58" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <text x="690" y="225" font-size="26" font-weight="bold" fill="#0e7c86">Public Key Directory</text>
  <text x="690" y="257" font-size="19" fill="#2b3a48">The company posts a sample of its</text>
  <text x="690" y="281" font-size="19" fill="#2b3a48">“seal” on its own website.</text>
  <text x="690" y="307" font-size="19" font-style="italic" fill="#4a5a6a">Anyone can look it up.</text>

  <!-- ===== AI Agent (left) ===== -->
  <rect x="70" y="400" width="400" height="250" rx="18" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="3"/>
  <!-- robot icon -->
  <g transform="translate(105,440)">
    <line x1="40" y1="0" x2="40" y2="14" stroke="#1f3a5f" stroke-width="4"/>
    <circle cx="40" cy="0" r="6" fill="#1f3a5f"/>
    <rect x="0" y="14" width="80" height="62" rx="12" fill="#1f3a5f"/>
    <circle cx="24" cy="42" r="9" fill="#ffffff"/>
    <circle cx="56" cy="42" r="9" fill="#ffffff"/>
    <rect x="22" y="60" width="36" height="6" rx="3" fill="#ffffff"/>
  </g>
  <text x="205" y="470" font-size="28" font-weight="bold" fill="#1f3a5f">AI Agent</text>
  <text x="205" y="502" font-size="19" fill="#2b3a48">Run by “Example AI Co.”</text>
  <!-- secret key -->
  <g transform="translate(105,555)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#b8860b" stroke-width="6"/>
    <rect x="32" y="14" width="44" height="8" fill="#b8860b"/>
    <rect x="62" y="22" width="6" height="12" fill="#b8860b"/>
    <rect x="72" y="22" width="6" height="9" fill="#b8860b"/>
  </g>
  <text x="200" y="570" font-size="20" font-weight="bold" fill="#8a6508">Secret key</text>
  <text x="200" y="596" font-size="18" fill="#2b3a48">Used to seal every request.</text>
  <text x="200" y="620" font-size="18" fill="#2b3a48">Never shared with anyone.</text>

  <!-- ===== Your Website (right) ===== -->
  <rect x="1130" y="400" width="400" height="250" rx="18" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="3"/>
  <!-- browser icon -->
  <g transform="translate(1160,440)">
    <rect x="0" y="0" width="96" height="74" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="0" y="0" width="96" height="18" rx="6" fill="#1f3a5f"/>
    <circle cx="12" cy="9" r="3.5" fill="#ffffff"/>
    <circle cx="24" cy="9" r="3.5" fill="#ffffff"/>
    <circle cx="36" cy="9" r="3.5" fill="#ffffff"/>
    <rect x="12" y="30" width="72" height="7" rx="3" fill="#9fb3c8"/>
    <rect x="12" y="44" width="56" height="7" rx="3" fill="#9fb3c8"/>
    <rect x="12" y="58" width="64" height="7" rx="3" fill="#9fb3c8"/>
  </g>
  <text x="1275" y="470" font-size="28" font-weight="bold" fill="#1f3a5f">Your Website</text>
  <text x="1275" y="502" font-size="19" fill="#2b3a48">(or your CDN, e.g.</text>
  <text x="1275" y="526" font-size="19" fill="#2b3a48">Cloudflare)</text>
  <text x="1160" y="585" font-size="19" fill="#2b3a48">Compares the seal on the request</text>
  <text x="1160" y="611" font-size="19" fill="#2b3a48">with the company’s posted sample.</text>

  <!-- ===== Step 1: publish (agent -> directory) ===== -->
  <path d="M 270 395 C 270 290, 400 250, 572 250" fill="none" stroke="#0e7c86" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrT)"/>
  <circle cx="300" cy="262" r="22" fill="#0e7c86"/>
  <text x="300" y="271" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="200" y="315" text-anchor="middle" font-size="19" fill="#0e7c86" font-weight="bold">Publish the seal</text>
  <text x="200" y="339" text-anchor="middle" font-size="17" fill="#4a5a6a">(one-time setup)</text>

  <!-- ===== Step 2: request travels (agent -> website) ===== -->
  <line x1="478" y1="525" x2="1120" y2="525" stroke="#1f3a5f" stroke-width="5" marker-end="url(#arr)"/>
  <!-- envelope with wax seal -->
  <g transform="translate(728,470)">
    <rect x="0" y="0" width="144" height="96" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="4"/>
    <path d="M 4 6 L 72 56 L 140 6" fill="none" stroke="#1f3a5f" stroke-width="4"/>
    <circle cx="72" cy="58" r="20" fill="#c0392b"/>
    <circle cx="72" cy="58" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="72" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">AI</text>
  </g>
  <circle cx="560" cy="490" r="22" fill="#1f3a5f"/>
  <text x="560" y="499" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="800" y="605" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f3a5f">Request arrives with a digital seal</text>
  <text x="800" y="633" text-anchor="middle" font-size="18" fill="#4a5a6a">“I’m from Example AI Co.”, plus proof only they can make</text>

  <!-- ===== Step 3: look up (website -> directory) ===== -->
  <path d="M 1330 395 C 1330 290, 1200 250, 1028 250" fill="none" stroke="#0e7c86" stroke-width="4" marker-end="url(#arrT)"/>
  <circle cx="1300" cy="262" r="22" fill="#0e7c86"/>
  <text x="1300" y="271" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1405" y="315" text-anchor="middle" font-size="19" fill="#0e7c86" font-weight="bold">Look up the</text>
  <text x="1405" y="339" text-anchor="middle" font-size="19" fill="#0e7c86" font-weight="bold">company’s seal</text>

  <!-- ===== Step 4: outcomes ===== -->
  <circle cx="1095" cy="728" r="22" fill="#1f3a5f"/>
  <text x="1095" y="737" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <line x1="1330" y1="655" x2="1330" y2="682" stroke="#1f3a5f" stroke-width="4"/>
  <!-- verified -->
  <rect x="1130" y="685" width="400" height="60" rx="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="1165" cy="715" r="18" fill="#2e7d32"/>
  <path d="M 1156 715 L 1163 723 L 1176 707" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1195" y="709" font-size="19" font-weight="bold" fill="#1b5e20">Seal matches</text>
  <text x="1195" y="733" font-size="17" fill="#1b5e20">Verified: really Example AI Co.</text>
  <!-- unverified -->
  <rect x="1130" y="757" width="400" height="60" rx="30" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
  <circle cx="1165" cy="787" r="18" fill="#c62828"/>
  <path d="M 1157 779 L 1173 795 M 1173 779 L 1157 795" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="1195" y="781" font-size="19" font-weight="bold" fill="#8e1b1b">No seal, or seal doesn’t match</text>
  <text x="1195" y="805" font-size="17" fill="#8e1b1b">Unverified: could be an impostor</text>

  <!-- ===== Old way vs new (bottom left) ===== -->
  <rect x="70" y="690" width="960" height="127" rx="14" fill="#fff8e6" stroke="#e0b44c" stroke-width="2"/>
  <text x="95" y="727" font-size="21" font-weight="bold" fill="#7a5a10">Why it matters</text>
  <text x="95" y="757" font-size="19" fill="#2b3a48">Before: bots wore a name tag (the “User-Agent”). Anyone could write any name on it.</text>
  <text x="95" y="785" font-size="19" fill="#2b3a48">Now: the seal can only be made with the company’s secret key, so it can’t be faked.</text>

  <!-- Footer caveat -->
  <text x="800" y="868" text-anchor="middle" font-size="20" font-style="italic" fill="#4a5a6a">Note: this proves WHO operates the agent. It does not reveal which AI model the agent uses.</text>
</svg>
