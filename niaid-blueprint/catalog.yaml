# NIAID Blueprint agent plugin -- catalog source of truth.
# Same format as ../mcp-catalog/bio-nih-mcp.yaml: ARD v0.91 term names
# (https://agenticresourcediscovery.org/spec/) plus curation terms under `cat:`.
# Build:  python3 ../mcp-catalog/yaml2ard.py catalog.yaml          # -> ard.json
# Skill descriptions are copied verbatim from each SKILL.md frontmatter; when a
# SKILL.md changes, update the matching entry here and regenerate ard.json.
# Checked 2026-11-13.

catalog:
  id: urn:air:github.com:go-fair-us:ai-blueprint-core:niaid-blueprint-catalog
  name: NIAID Blueprint agent plugin catalog
  description: >-
    ARD entries for the niaid-blueprint agent plugin and its 12 Agent Skills.
    Listed from the bio/NIH catalog (../mcp-catalog) as a nested
    application/ai-catalog+json entry.
  version: "0.1.0"
  created: "2026-11-13"
  modified: "2026-11-13"
  maintainer:
    name: Douglas Fils
    github: fils
  ardSpec: https://agenticresourcediscovery.org/spec/   # v0.91
  "@context":
    - https://agenticresourcediscovery.org/context/v1
    # PLACEHOLDER namespace IRI, shared with ../mcp-catalog -- replace both before publishing.
    - cat: https://example.org/mcp-catalog/ns#

# Controlled values: see ../mcp-catalog/bio-nih-mcp.yaml and ../mcp-catalog/README.md.
#   cat:status alive for a skill = SKILL.md on master parses and its bundled tests
#              (where present) passed on the cat:lastChecked date.
#   cat:license NOASSERTION = the SKILL.md (or the repo, for the plugin) declares none.
#   cat:agents  only harnesses the repo itself documents: Pi for the whole bundle
#              (./bin/pi), plus Claude Code where a doc names it for that skill.

entries:

