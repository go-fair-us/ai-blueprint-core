  cat:license: NOASSERTION       # no LICENSE file in the repo yet; 8 of the 12 SKILL.md files declare Apache-2.0
  cat:lastCommit: "2026-11-13T20:14:43Z"
  cat:lastChecked: "2026-11-13"
  cat:verifiedBy: plugin.json and mcp.json read; all 12 SKILL.md frontmatters parsed; bundled Python skill tests run (73 passed)
  cat:reviewNotes: >-
    Agent Plugins layout (plugin.json and mcp.json use the agent-plugins.org 1.0.0
    schemas). mcp.json points at the Blueprint knowledge server at
    http://localhost:8000/mcp (mcp_bp/, started with ./bin/run_mcp.sh). That server is
