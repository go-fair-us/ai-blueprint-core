sections:
  verdict_mix:
    heading: Verdict mix
    caption: '{% if uniform_checks %}Each bar is the {{ n_checks }} checks for that repository.{% else %}Bar length is the number of checks run for that repository ({{ checks_min }} to {{ checks_max }}).{%
      endif %}'
    footnote: P present, ~ partial, A absent, B blocked, o not-observable, ? unparsed. Synthetic data.
  check_grid:
    heading: Check by repository
    caption: '{{ n_checks }} checks in {{ n_categories|words }} categories, left to right. Color is the summary verdict.'
    footnote: 'Test footnote. Category counts per repository: {% for r in repositories %}{{ r.name }} {{ r.category_counts.values()|join(''/'') }}{% if not loop.last %}; {% endif %}{% endfor %}.'
  competency:
    heading: Competency questions
    caption: '{{ n_questions|words|capitalize }} questions: {{ q.match }} match, {{ q.partial }} partial, {{ q.ungraded }} ungraded, {{ q[''no-answer''] }} no answer.'
    notes_heading: How to read the grades
    notes:
    - 'Questions per repository: {% for r in repositories %}{{ r.name }} {{ r.questions|length }}{% if not loop.last %}, {% endif %}{% endfor %}.'
    - '{% if no_question_repos %}{{ no_question_repos|join_and }} had no competency questions.{% endif %}'
